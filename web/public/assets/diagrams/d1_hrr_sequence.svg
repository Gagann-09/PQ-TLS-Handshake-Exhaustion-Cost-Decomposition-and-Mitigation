<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 450" width="700" height="450">
  <rect width="700" height="450" fill="#fafafa"/>
  
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">D1: HRR Sequence for ML-KEM-768 (Observed)</text>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#c62828"><strong>COOKIE NOT OBSERVED</strong> — stateless cookie extension (type 44) absent in HRR and ClientHello2</text>
  
  <!-- Client column -->
  <g transform="translate(100, 80)">
    <line x1="0" y1="0" x2="0" y2="350" stroke="#5f6368" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Client</text>
    
    <!-- ClientHello -->
    <g transform="translate(0, 20)">
      <rect x="-80" y="-15" width="160" height="30" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">ClientHello</text>
      <text x="0" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3c4043">supported_groups: X25519, MLKEM768</text>
      <text x="0" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3c4043">key_share: X25519</text>
    </g>
    
    <!-- ClientHello2 -->
    <g transform="translate(0, 180)">
      <rect x="-80" y="-15" width="160" height="30" rx="4" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">ClientHello2</text>
      <text x="0" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3c4043">key_share: MLKEM768</text>
      <text x="0" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#c62828">cookie extension: ABSENT</text>
    </g>
  </g>
  
  <!-- Server column -->
  <g transform="translate(500, 80)">
    <line x1="0" y1="0" x2="0" y2="350" stroke="#5f6368" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Server</text>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">openssl s_server -stateless</text>
    <text x="0" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">-groups MLKEM768</text>
    
    <!-- HelloRetryRequest -->
    <g transform="translate(0, 100)">
      <rect x="-100" y="-15" width="200" height="30" rx="4" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">HelloRetryRequest</text>
      <text x="0" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3c4043">RFC 8446 special random (observed)</text>
      <text x="0" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3c4043">requests key_share: MLKEM768</text>
      <text x="0" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#c62828">cookie extension: ABSENT</text>
    </g>
    
    <!-- ServerHello -->
    <g transform="translate(0, 260)">
      <rect x="-100" y="-15" width="200" height="30" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">ServerHello</text>
      <text x="0" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3c4043">negotiated group: MLKEM768</text>
      <text x="0" y="35" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#3c4043">TLS 1.3 handshake COMPLETED</text>
    </g>
  </g>
  
  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#5f6368"/>
    </marker>
  </defs>
  
  <!-- ClientHello arrow -->
  <path d="M100,85 L500,85" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">1. ClientHello (X25519 key_share)</text>
  
  <!-- HRR arrow -->
  <path d="M500,145 L100,145" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">2. HRR (special random, requests MLKEM768)</text>
  
  <!-- ClientHello2 arrow -->
  <path d="M100,225 L500,225" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">3. ClientHello2 (MLKEM768 key_share, no cookie)</text>
  
  <!-- ServerHello arrow -->
  <path d="M500,305 L100,305" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="300" y="298" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">4. ServerHello (MLKEM768) → completed</text>
  
  <!-- Key findings box -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="600" height="80" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="20" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">Key Findings (D7-010, D7-011):</text>
    <text x="20" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">• OpenSSL 3.5.5 and 3.5.9: HRR mechanism works correctly for ML-KEM-768</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">• Stateless cookie extension (RFC 8446 §4.2.2, type 44) NOT emitted in HRR, NOT echoed in ClientHello2</text>
    <text x="20" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">• D1 = HRR without cookie; no DoS-reduction property realized for ML-KEM-768</text>
  </g>
</svg>