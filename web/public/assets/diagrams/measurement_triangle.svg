<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <rect width="600" height="500" fill="#fafafa"/>
  
  <text x="300" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Measurement Triangle (Locked Methodology)</text>
  <text x="300" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5f6368">Three independent evidence streams — no stream proxies another</text>
  
  <!-- Triangle vertices -->
  <!-- TLS Events (top) -->
  <g transform="translate(300, 100)">
    <circle cx="0" cy="0" r="60" fill="#e8f0fe" stroke="#1a73e8" stroke-width="3"/>
    <text x="0" y="-5" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">TLS Events</text>
    <text x="0" y="15" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3c4043">WHAT protocol work</text>
    <text x="0" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3c4043">was observed</text>
    <text x="0" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">Source: OpenSSL transcript</text>
    <text x="0" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">negotiated_group (nullable)</text>
    <text x="0" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">negotiated_signature_algorithm (nullable)</text>
    <text x="0" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">outcome: completed | aborted_pre_finished | error</text>
  </g>
  
  <!-- CPU Process Cost (bottom left) -->
  <g transform="translate(80, 350)">
    <circle cx="0" cy="0" r="80" fill="#fce4ec" stroke="#c62828" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">CPU Process Cost</text>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3c4043">HOW MUCH server</text>
    <text x="0" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3c4043">compute consumed</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">Tool: pidstat (1 Hz) in container</text>
    <text x="0" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">Target: openssl s_server PID</text>
    <text x="0" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">Metric: CPU-seconds / all attempts</text>
    <text x="0" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">Host psutil / Docker stats: NOT fallback</text>
  </g>
  
  <!-- Wire Bytes (bottom right) -->
  <g transform="translate(520, 350)">
    <circle cx="0" cy="0" r="80" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
    <text x="0" y="-10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Wire Bytes</text>
    <text x="0" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3c4043">HOW MUCH network</text>
    <text x="0" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3c4043">traffic accompanied</text>
    <text x="0" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">Tool: tcpdump in container</text>
    <text x="0" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">IP-packet bytes (excl. Ethernet)</text>
    <text x="0" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">bytes_received/attempt, bytes_sent/attempt</text>
    <text x="0" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5f6368">No payload, no keylog retention</text>
  </g>
  
  <!-- Triangle edges -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#5f6368"/>
    </marker>
  </defs>
  
  <!-- TLS → CPU -->
  <path d="M300,160 L160,270" stroke="#5f6368" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="180" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">explains WHY</text>
  
  <!-- TLS → Wire -->
  <path d="M300,160 L440,270" stroke="#5f6368" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="420" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">explains WHY</text>
  
  <!-- CPU ↔ Wire -->
  <path d="M160,350 L440,350" stroke="#5f6368" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="300" y="365" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">independent</text>
  
  <!-- Independence rules -->
  <g transform="translate(50, 460)">
    <rect x="0" y="0" width="500" height="30" rx="4" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="250" y="20" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1a1a1a">Independence Rules: packet count ≠ CPU cost | handshake count ≠ CPU cost | config ≠ observation | wall-clock ≠ CPU-seconds</text>
  </g>
</svg>