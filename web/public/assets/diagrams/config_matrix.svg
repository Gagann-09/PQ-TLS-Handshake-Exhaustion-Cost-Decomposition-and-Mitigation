<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <rect width="700" height="320" fill="#fafafa"/>
  
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">TLS Configuration Matrix (C0–C4)</text>
  <text x="350" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5f6368">All 5 configurations negotiated successfully on OpenSSL 3.5.5 default provider</text>
  
  <!-- Table header -->
  <g transform="translate(50, 70)">
    <rect x="0" y="0" width="600" height="40" fill="#1a73e8"/>
    <text x="50" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">ID</text>
    <text x="150" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">Key Establishment</text>
    <text x="350" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">Authentication</text>
    <text x="520" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white">Purpose</text>
  </g>
  
  <!-- Table rows -->
  <g transform="translate(50, 110)">
    <!-- C0 -->
    <rect x="0" y="0" width="600" height="40" fill="#e8f0fe"/>
    <text x="50" y="26" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">C0</text>
    <text x="150" y="26" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">X25519</text>
    <text x="350" y="26" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">ECDSA-P256</text>
    <text x="520" y="26" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">Classical baseline</text>
    
    <!-- C1 -->
    <rect x="0" y="40" width="600" height="40" fill="white"/>
    <text x="50" y="66" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">C1</text>
    <text x="150" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">ML-KEM-768</text>
    <text x="350" y="66" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">ECDSA-P256</text>
    <text x="520" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">Isolates PQ key-establishment cost (RQ1)</text>
    
    <!-- C2 -->
    <rect x="0" y="80" width="600" height="40" fill="#e8f0fe"/>
    <text x="50" y="106" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">C2</text>
    <text x="150" y="106" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">X25519</text>
    <text x="350" y="106" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">ML-DSA-65</text>
    <text x="520" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">Isolates PQ authentication cost (RQ1)</text>
    
    <!-- C3 -->
    <rect x="0" y="120" width="600" height="40" fill="white"/>
    <text x="50" y="146" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">C3</text>
    <text x="150" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">X25519 + ML-KEM-768 (hybrid)</text>
    <text x="350" y="146" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">ECDSA-P256</text>
    <text x="520" y="146" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">Hybrid key establishment (RFC 10024)</text>
    
    <!-- C4 -->
    <rect x="0" y="160" width="600" height="40" fill="#e8f0fe"/>
    <text x="50" y="186" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1a1a1a">C4</text>
    <text x="150" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">ML-KEM-768</text>
    <text x="350" y="186" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">ML-DSA-65</text>
    <text x="520" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">Combined PQ configuration (RQ1, RQ2)</text>
  </g>
  
  <!-- Workload modes -->
  <g transform="translate(50, 250)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Workload Modes:</text>
    <text x="160" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">W0 — normal_completion (full TLS 1.3 handshake)</text>
    <text x="160" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#1a1a1a">W1 — controlled_abort (ClientHello → disconnect pre-Finished)</text>
  </g>
  
  <!-- Defense modes -->
  <g transform="translate(50, 280)">
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Defense Modes (C1×W1):</text>
    <text x="180" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">D0: baseline | D1: HRR (no cookie for ML-KEM-768) | D2: source budget (5/sec) | D3: D1+D2</text>
  </g>
</svg>