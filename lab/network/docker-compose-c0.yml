# C0 Classical Baseline — X25519 + ECDSA-P256
# Reuses the Phase 1 lab network with C0-pinned TLS server.

services:
  tls-server:
    image: alpine:3.19
    command: sh -c "apk add --no-cache openssl && openssl s_server -accept 4433 -cert /certs/server.crt -key /certs/server.key -www -tls1_3 -groups X25519 -sigalgs ecdsa_secp256r1_sha256 -naccept 1000"
    ports:
      - "4433:4433"
    volumes:
      - ../certs:/certs:ro
    networks:
      - lab-network
    restart: unless-stopped

networks:
  lab-network:
    driver: bridge
