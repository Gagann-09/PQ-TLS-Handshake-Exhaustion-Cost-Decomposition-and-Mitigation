version: "3.8"

services:
  tls-server:
    image: alpine:3.19
    command: >
      sh -c "apk add --no-cache openssl &&
             openssl s_server -accept 4433
             -cert /certs/server.crt -key /certs/server.key
             -www -tls1_3 -naccept 1000"
    ports:
      - "4433:4433"
    volumes:
      - ./certs:/certs:ro
    networks:
      - lab-network
    restart: unless-stopped

networks:
  lab-network:
    driver: bridge
