# C1 PQ Key Establishment — ML-KEM-768 + ECDSA-P256
# Isolates PQ key-establishment cost (RQ1).
# Reuses the Phase 1 lab network with C1-pinned TLS server.

services:
  tls-server:
    image: alpine:3.19
    command: sh -c "apk add --no-cache openssl && openssl s_server -accept 4433 -cert /certs/server.crt -key /certs/server.key -www -tls1_3 -groups MLKEM768 -sigalgs ecdsa_secp256r1_sha256 -naccept 1000"
    ports:
      - "4433:4433"
    volumes:
      - ../certs:/certs:ro
    networks:
      - lab-network
    restart: unless-stopped

networks:
  lab-network:
    driver: bridge
