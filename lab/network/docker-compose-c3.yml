# C3 Hybrid Key Establishment — X25519 + ML-KEM-768 hybrid + ECDSA-P256
# Isolates hybrid key-establishment cost (RQ1).
# Reuses the Phase 1 lab network with C3-pinned TLS server.
# Includes workload client container with OpenSSL 3.5+.

services:
  tls-server:
    image: alpine:3.22
    command: sh -c "apk add --no-cache openssl tcpdump && openssl s_server -accept 4433 -cert /certs/server.crt -key /certs/server.key -www -tls1_3 -groups X25519MLKEM768 -sigalgs ecdsa_secp256r1_sha256 -naccept 1000"
    ports:
      - "4433:4433"
    volumes:
      - ../certs:/certs:ro
    networks:
      - lab-network
    restart: unless-stopped

  workload-client:
    image: alpine:3.22
    command: sh -c "apk add --no-cache python3 openssl && tail -f /dev/null"
    volumes:
      - ../certs:/certs:ro
      - ../../src:/src:ro
      - ../../scripts:/scripts:ro
    networks:
      - lab-network
    depends_on:
      - tls-server
    restart: unless-stopped

networks:
  lab-network:
    driver: bridge