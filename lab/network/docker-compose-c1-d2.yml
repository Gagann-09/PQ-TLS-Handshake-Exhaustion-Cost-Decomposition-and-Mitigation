# C1 × W1 × D2 — Source Admission Budget
# Proxy on 4433 -> C1 TLS Server on 4434
# Admission proxy applies per-source rate limiting (5/sec)

services:
  tls-server:
    image: alpine:3.22
    command: sh -c "apk add --no-cache openssl tcpdump && openssl s_server -accept 4434 -cert /certs/server.crt -key /certs/server.key -www -tls1_3 -groups MLKEM768 -sigalgs ecdsa_secp256r1_sha256 -naccept 1000"
    ports:
      - "4434:4434"
    volumes:
      - ../certs:/certs:ro
    networks:
      - lab-network
    restart: unless-stopped

  admission-proxy:
    build:
      context: ../../
      dockerfile: lab/server/Dockerfile.proxy
    ports:
      - "4433:4433"
    networks:
      - lab-network
    depends_on:
      - tls-server
    restart: unless-stopped

  workload-client:
    image: alpine:3.22
    command: sh -c "apk add --no-cache python3 openssl && tail -f /dev/null"
    volumes:
      - ../certs:/certs:ro
      - ../../src:/src:ro
      - ../../scripts:/scripts:ro
    networks:
      - lab-network
    depends_on:
      - admission-proxy
    restart: unless-stopped

networks:
  lab-network:
    driver: bridge