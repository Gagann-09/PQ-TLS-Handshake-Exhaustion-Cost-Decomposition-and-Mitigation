<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Background -->
  <rect width="800" height="500" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Experimental Architecture</text>
  
  <!-- Experiment Controller -->
  <g transform="translate(250, 60)">
    <rect x="0" y="0" width="300" height="80" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
    <text x="150" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Experiment Controller</text>
    <text x="150" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">matrix · safety limits · repetitions · logging</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M400,140 L400,160" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 Z" fill="#5f6368"/>
    </marker>
  </defs>
  
  <!-- Workload Client -->
  <g transform="translate(50, 180)">
    <rect x="0" y="0" width="280" height="100" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="140" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Controlled TLS Workload</text>
    <text x="140" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">bounded attempts only</text>
    <text x="140" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">W0: normal_completion</text>
    <text x="140" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">W1: controlled_abort</text>
  </g>
  
  <!-- Arrow from workload to merge -->
  <path d="M190,280 L280,280" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Legitimate Client -->
  <g transform="translate(470, 180)">
    <rect x="0" y="0" width="280" height="100" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="140" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">Legitimate TLS Client</text>
    <text x="140" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">steady background rate (1 req/s)</text>
    <text x="140" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">independent of workload</text>
    <text x="140" y="85" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">availability baseline (RQ5)</text>
  </g>
  
  <!-- Merge point -->
  <circle cx="400" cy="300" r="15" fill="#f5f5f5" stroke="#5f6368" stroke-width="2"/>
  <text x="400" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">merge</text>
  
  <!-- Arrow down from merge -->
  <path d="M400,315 L400,330" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Lab Network -->
  <g transform="translate(200, 330)">
    <rect x="0" y="0" width="400" height="50" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
    <text x="200" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Laboratory Network (Docker bridge)</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M400,380 L400,395" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- TLS Server with Defense Layer -->
  <g transform="translate(150, 395)">
    <rect x="0" y="0" width="500" height="90" rx="8" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
    <text x="250" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1a1a1a">TLS 1.3 Server (OpenSSL 3.5+)</text>
    <text x="250" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">Configurations: C0 · C1 · C2 · C3 · C4</text>
    <text x="250" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">Defense Layer: D0 (baseline) · D1 (HRR) · D2 (source budget) · D3 (combined)</text>
    <text x="250" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">D1: HRR observed, cookie_observed = false for ML-KEM-768</text>
  </g>
  
  <!-- Arrow down -->
  <path d="M400,485 L400,500" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Instrumentation -->
  <g transform="translate(200, 500)">
    <rect x="0" y="0" width="400" height="50" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
    <text x="200" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">Instrumentation</text>
    <text x="200" y="45" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3c4043">pidstat (CPU) · tcpdump (wire bytes) · TLS transcripts (negotiated group, signature, outcome)</text>
  </g>
</svg>