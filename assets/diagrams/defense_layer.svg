<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <rect width="700" height="400" fill="#fafafa"/>
  
  <text x="350" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">Defense Layer Architecture (D0–D3)</text>
  
  <!-- D0: Baseline -->
  <g transform="translate(50, 60)">
    <rect x="0" y="0" width="600" height="70" rx="8" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">D0 — Baseline</text>
    <text x="20" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">ClientHello → TLS 1.3 processing (no admission control)</text>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">CPU/attempt: ~1.49 ms (C1×W1) | Legitimate success: 96%</text>
  </g>
  
  <!-- D1: HRR -->
  <g transform="translate(50, 145)">
    <rect x="0" y="0" width="600" height="80" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">D1 — Stateless HRR (OpenSSL s_server -stateless)</text>
    <text x="20" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">ClientHello (X25519 key_share) → HRR (requests MLKEM768) → ClientHello2 (MLKEM768 key_share) → ServerHello</text>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#c62828"><strong>COOKIE NOT OBSERVED</strong> — cookie extension (type 44) absent in HRR and ClientHello2</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">CPU/attempt: ~1.54 ms (C1×W1) | +3% vs D0 | Legitimate success: 100% | +1 RTT</text>
  </g>
  
  <!-- D2: Source Budget -->
  <g transform="translate(50, 240)">
    <rect x="0" y="0" width="600" height="80" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">D2 — Source Admission Budget (userspace proxy)</text>
    <text x="20" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">Proxy (port 4433) → token bucket (5 tokens, 5/sec refill) → TLS server (port 4434)</text>
    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="10" fill="#2e7d32"><strong>~88% CPU reduction</strong> — 87% of workload rejected at proxy, only ~13% reach TLS server</text>
    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">CPU/attempt: ~0.18 ms (C1×W1) | Legitimate success: 100% (1 req/s passes)</text>
  </g>
  
  <!-- D3: Combined -->
  <g transform="translate(50, 335)">
    <rect x="0" y="0" width="600" height="55" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2"/>
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a1a1a">D3 — Combined (D2 proxy → D1 stateless server)</text>
    <text x="20" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#3c4043">Proxy (4433, token bucket) → D1 server (4434, HRR no cookie) — no additional benefit over D2 alone</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="10" fill="#5f6368">CPU/attempt: ~0.19 ms | Legitimate success: 100%</text>
  </g>
</svg>